[package]
name = "floway-desktop"
version = "0.1.0"
description = "Floway desktop application shell"
edition = "2024"
license = "MIT"
autobins = false
default-run = "floway-one"

[lib]
name = "floway_desktop"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "floway-one"
path = "src/main.rs"
required-features = ["desktop"]

[[test]]
name = "bundle_contract"
path = "__tests__/src/bundle_contract_test.rs"

[features]
default = ["desktop"]
desktop = [
  "dep:getrandom",
  "dep:libc",
  "dep:signal-hook",
  "dep:tauri",
  "dep:tauri-build",
  "dep:tauri-plugin-shell",
]

[dependencies]
# https://github.com/rust-random/getrandom/releases/tag/v0.3.4
getrandom = { version = "=0.3.4", optional = true, features = ["std"] }
# https://github.com/rust-lang/libc/releases/tag/0.2.189
libc = { version = "=0.2.189", optional = true }
# https://github.com/vorner/signal-hook/releases/tag/v0.4.4
signal-hook = { version = "=0.4.4", optional = true, features = ["iterator"] }
# https://github.com/serde-rs/json/releases/tag/v1.0.151
serde_json = { version = "=1.0.151" }
# https://github.com/RustCrypto/hashes/releases/tag/sha2-v0.10.9
sha2 = { version = "=0.10.9" }
# https://github.com/tauri-apps/tauri/releases/tag/tauri-v2.11.5
tauri = { version = "=2.11.5", optional = true, features = [] }
# https://github.com/tauri-apps/plugins-workspace/releases/tag/shell-v2.3.6
tauri-plugin-shell = { version = "=2.3.6", optional = true }
[build-dependencies]
# https://github.com/tauri-apps/tauri/releases/tag/tauri-build-v2.6.3
tauri-build = { version = "=2.6.3", optional = true, features = [] }
