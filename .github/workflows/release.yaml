name: Release

# Publishes the signed and notarized macOS installers for Apple Silicon and
# Intel from one tag, with the updater manifest and digest evidence attached.
# Secrets the signing path needs (repository settings):
#   APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD / APPLE_SIGNING_IDENTITY
#   APPLE_API_ISSUER / APPLE_API_KEY / APPLE_API_KEY_CONTENT
#   TAURI_SIGNING_PRIVATE_KEY / TAURI_SIGNING_PRIVATE_KEY_PASSWORD (optional)
# A manual run may pass sign=false to exercise the pipeline unsigned; unsigned
# artifacts stay workflow artifacts and are never published.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      sign:
        description: 'Sign and notarize the installers'
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  SIGN: ${{ github.event.inputs.sign || 'true' }}

jobs:
  build-installer:
    name: build-${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: aarch64
            runner: macos-15
            target: aarch64-apple-darwin
          - name: x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Enable exact package-manager version
        run: corepack enable
      - name: Set up exact packaged Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: apps/desktop/.node-version
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Install the macOS Rust target
        run: rustup target add ${{ matrix.target }}
      - name: Refuse to sign without the signing secrets
        if: env.SIGN == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_API_KEY_CONTENT TAURI_SIGNING_PRIVATE_KEY; do
            eval "value=\${$name}"
            if [ -z "$value" ]; then
              echo "::error::Release signing requires the $name secret. See docs/release-runbook.zh-CN.md."
              exit 1
            fi
          done
      - name: Import the Developer ID certificate
        if: env.SIGN == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          certificate_path="$RUNNER_TEMP/floway-developer-id.p12"
          keychain_path="$RUNNER_TEMP/floway-signing.keychain-db"
          echo -n "$APPLE_CERTIFICATE" | base64 --decode --output "$certificate_path"
          security create-keychain -p "" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "" "$keychain_path"
          security import "$certificate_path" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple: -k "" "$keychain_path"
          security list-keychain -d user -s "$keychain_path"
      - name: Build the web dashboard
        run: pnpm run build:web
      - name: Build, sign, and notarize the installer
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ "$SIGN" = "true" ]; then
            echo "$APPLE_API_KEY_CONTENT" > "$RUNNER_TEMP/AuthKey.p8"
            export APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          fi
          pnpm --filter @floway-dev/desktop exec tauri build --target ${{ matrix.target }}
      - name: Gate the release on the packaged verification
        run: pnpm --filter @floway-dev/desktop run test:packaged:macos -- --target=${{ matrix.target }} --profile=release --launch=yes
      - name: Upload the architecture artifacts
        uses: actions/upload-artifact@v4
        with:
          name: floway-macos-${{ matrix.name }}
          path: |
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: error

  publish:
    name: publish
    needs: [build-installer]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Enable exact package-manager version
        run: corepack enable
      - name: Set up exact packaged Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: apps/desktop/.node-version
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Collect the architecture artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: floway-macos-*
          path: release-artifacts
          merge-multiple: true
      - name: Assemble the updater manifest and digest evidence
        env:
          TAG: ${{ github.ref_name }}
        run: pnpm --filter @floway-dev/desktop run release:manifest -- --version="${TAG#v}" --tag="$TAG" --repo=${{ github.repository }} --dir=release-artifacts
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          {
            echo "Floway $TAG"
            echo
            echo "- Source commit: ${{ github.sha }}"
            echo
            echo '```'
            cat release-artifacts/sha256sums.txt
            echo '```'
          } > release-notes.md
          gh release create "$TAG" \
            --title "Floway $TAG" \
            --notes-file release-notes.md \
            release-artifacts/*.dmg \
            release-artifacts/*.app.tar.gz \
            release-artifacts/*.app.tar.gz.sig \
            release-artifacts/floway-update.json \
            release-artifacts/sha256sums.txt
