name: Release

# Tag pushes and explicit manual publication share one exact source and one
# dual-architecture build. Preview dispatches only upload workflow artifacts.
# The updater signature is mandatory for publication; Apple signing remains
# an optional layer, or a requirement when the owner selects sign=true.
# https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#onworkflow_dispatchinputs
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish a stable GitHub Release (otherwise preview only)'
        type: boolean
        default: false
      version:
        description: 'Publication version X.Y.Z, matching checked-in versions'
        type: string
        required: false
      commit:
        description: 'Full verified main commit SHA required for publication'
        type: string
        required: false
      sign:
        description: 'Require Apple Developer ID signing and notarization'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version && format('v{0}', inputs.version) || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_PUBLISH: ${{ inputs.publish || false }}
  RELEASE_VERSION: ${{ inputs.version }}
  RELEASE_COMMIT: ${{ inputs.commit }}

jobs:
  prepare:
    name: validate-release-source
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      tag: ${{ steps.source.outputs.tag }}
      version: ${{ steps.source.outputs.version }}
      source_commit: ${{ steps.source.outputs.source_commit }}
      publish: ${{ steps.source.outputs.publish }}
    steps:
      - name: Checkout the exact source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit || github.sha }}
          fetch-depth: 0
      - name: Enable exact package-manager version
        run: corepack enable
      - name: Set up exact packaged Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: apps/desktop/.node-version
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Validate source, versions, notes, and publication eligibility
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: pnpm --filter @floway-dev/desktop run release:require
      - name: Require the publication signing key
        if: steps.source.outputs.publish == 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::Publishing requires TAURI_SIGNING_PRIVATE_KEY. See docs/release-runbook.zh-CN.md."
            exit 1
          fi

  build-installer:
    name: build-${{ matrix.name }}
    needs: [prepare]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: aarch64
            runner: macos-15
            target: aarch64-apple-darwin
          - name: x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    outputs:
      apple_signed: ${{ steps.signing.outputs.signed }}
      updater_signed: ${{ steps.signing.outputs.updater_signed }}
    steps:
      - name: Checkout the validated source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.source_commit }}
      - name: Enable exact package-manager version
        run: corepack enable
      - name: Set up exact packaged Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: apps/desktop/.node-version
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Install the macOS Rust target
        run: rustup target add ${{ matrix.target }}
      - name: Resolve the signing mode
        id: signing
        env:
          PUBLISH: ${{ needs.prepare.outputs.publish }}
          REQUIRE_APPLE: ${{ inputs.sign || false }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          umask 077
          apple_complete=false
          if [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_API_KEY_CONTENT" ] && [ -n "$APPLE_SIGNING_IDENTITY" ] && [ -n "$APPLE_API_ISSUER" ] && [ -n "$APPLE_API_KEY" ]; then
            apple_complete=true
          fi
          if [ "$REQUIRE_APPLE" = "true" ] && [ "$apple_complete" != "true" ]; then
            echo "::error::sign=true requires the complete Apple signing credentials. See docs/release-runbook.zh-CN.md."
            exit 1
          fi
          signed=false
          if [ "$apple_complete" = "true" ] && { [ "$PUBLISH" = "true" ] || [ "$REQUIRE_APPLE" = "true" ]; }; then
            signed=true
          fi
          echo "signed=$signed" >> "$GITHUB_OUTPUT"
          if [ "$PUBLISH" = "true" ] && [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::Publishing requires TAURI_SIGNING_PRIVATE_KEY."
            exit 1
          fi
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            printf '%s' "$TAURI_SIGNING_PRIVATE_KEY" > "$RUNNER_TEMP/floway-updater.key"
            {
              echo "TAURI_SIGNING_PRIVATE_KEY=$RUNNER_TEMP/floway-updater.key"
              echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
              echo 'TAURI_BUILD_CONFIG={"bundle":{"createUpdaterArtifacts":true}}'
            } >> "$GITHUB_ENV"
            echo "updater_signed=true" >> "$GITHUB_OUTPUT"
          else
            echo 'TAURI_BUILD_CONFIG={"bundle":{"createUpdaterArtifacts":false}}' >> "$GITHUB_ENV"
            echo "updater_signed=false" >> "$GITHUB_OUTPUT"
          fi
          if [ "$signed" = "true" ]; then
            printf '%s' "$APPLE_API_KEY_CONTENT" > "$RUNNER_TEMP/AuthKey.p8"
            {
              echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY"
              echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
              echo "APPLE_API_KEY=$APPLE_API_KEY"
              echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8"
            } >> "$GITHUB_ENV"
          fi
      - name: Import the Developer ID certificate
        if: steps.signing.outputs.signed == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          certificate_path="$RUNNER_TEMP/floway-developer-id.p12"
          keychain_path="$RUNNER_TEMP/floway-signing.keychain-db"
          echo -n "$APPLE_CERTIFICATE" | base64 --decode --output "$certificate_path"
          security create-keychain -p "" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "" "$keychain_path"
          security import "$certificate_path" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple: -k "" "$keychain_path"
          security list-keychain -d user -s "$keychain_path"
      - name: Build the web dashboard
        run: pnpm run build:web
      # Updater output is a release-only override; normal debug verification
      # still builds without the owner's private key.
      # https://v2.tauri.app/plugin/updater/#building
      - name: Build the installer and updater artifacts
        run: pnpm --filter @floway-dev/desktop exec tauri build --target ${{ matrix.target }} --config "$TAURI_BUILD_CONFIG"
      - name: Gate the release on the packaged verification
        run: pnpm --filter @floway-dev/desktop run test:packaged:macos -- --target=${{ matrix.target }} --profile=release --launch=yes
      - name: Collect architecture-specific assets without repacking signed bytes
        run: pnpm --filter @floway-dev/desktop run release:collect -- --target=${{ matrix.target }} --dir="$GITHUB_WORKSPACE/release-artifacts" --updater=${{ steps.signing.outputs.updater_signed }}
      - name: Upload the architecture artifacts
        uses: actions/upload-artifact@v4
        with:
          name: floway-macos-${{ matrix.name }}
          path: release-artifacts/*
          if-no-files-found: error

  assemble:
    name: assemble-release-assets
    needs: [prepare, build-installer]
    if: needs.build-installer.outputs.updater_signed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout the validated source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.source_commit }}
      - name: Enable exact package-manager version
        run: corepack enable
      - name: Set up exact packaged Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: apps/desktop/.node-version
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Collect the architecture artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: floway-macos-*
          path: release-artifacts
          merge-multiple: true
      - name: Assemble artifact digest evidence
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: pnpm --filter @floway-dev/desktop run release:manifest -- --version="${TAG#v}" --tag="$TAG" --repo=${{ github.repository }} --dir="$GITHUB_WORKSPACE/release-artifacts"
      - name: Prepare shared release notes
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          APPLE_SIGNED: ${{ needs.build-installer.outputs.apple_signed }}
          SOURCE_COMMIT: ${{ needs.prepare.outputs.source_commit }}
        run: |
          test -s "docs/releases/${TAG#v}.md"
          {
            cat "docs/releases/${TAG#v}.md"
            echo
            echo "- Source commit: $SOURCE_COMMIT"
            if [ "$APPLE_SIGNED" != "true" ]; then
              echo
              echo '> [!IMPORTANT]'
              echo '> This build is not Developer ID signed or notarized. To install: open the DMG, drag Floway to Applications, then right-click the app and choose Open — or run `xattr -dr com.apple.quarantine /Applications/Floway.app` once. Updates remain integrity-protected by the built-in updater signature.'
              echo '>'
              echo '> 本安装包未经 Developer ID 签名与公证。安装方式：打开 DMG 并将 Floway 拖入“应用程序”，然后右键点 App 选“打开”——或执行一次 `xattr -dr com.apple.quarantine /Applications/Floway.app`。内置更新签名不受影响。'
            fi
            echo
            echo '```'
            cat release-artifacts/sha256sums.txt
            echo '```'
          } > release-notes.md
      - name: Bind the same notes to the updater manifest
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: pnpm --filter @floway-dev/desktop run release:manifest -- --version="${TAG#v}" --tag="$TAG" --repo=${{ github.repository }} --dir="$GITHUB_WORKSPACE/release-artifacts" --notes-file="$GITHUB_WORKSPACE/release-notes.md"
      - name: Include the shared notes in the release asset set
        run: cp release-notes.md release-artifacts/release-notes.md
      - name: Upload the complete release asset set
        uses: actions/upload-artifact@v4
        with:
          name: floway-release
          path: release-artifacts/*
          if-no-files-found: error

  publish:
    name: publish
    needs: [prepare, assemble]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout the validated source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.source_commit }}
          fetch-depth: 0
      - name: Enable exact package-manager version
        run: corepack enable
      - name: Set up exact packaged Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: apps/desktop/.node-version
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Collect the complete release asset set
        uses: actions/download-artifact@v4
        with:
          name: floway-release
          path: release-artifacts
      - name: Recheck publication eligibility
        env:
          GH_TOKEN: ${{ github.token }}
        run: pnpm --filter @floway-dev/desktop run release:require
      # --target binds a new manual tag to the already-verified source. This
      # job publishes directly, so it does not depend on a GITHUB_TOKEN tag
      # push triggering another workflow.
      # https://cli.github.com/manual/gh_release_create
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          SOURCE_COMMIT: ${{ needs.prepare.outputs.source_commit }}
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_COMMIT" \
            --latest \
            --title "Floway $TAG" \
            --notes-file release-artifacts/release-notes.md \
            release-artifacts/*.dmg \
            release-artifacts/*.app.tar.gz \
            release-artifacts/*.app.tar.gz.sig \
            release-artifacts/floway-update.json \
            release-artifacts/sha256sums.txt
