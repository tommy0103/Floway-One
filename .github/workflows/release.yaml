name: Release

# Publishes the macOS installers for Apple Silicon and Intel from one tag,
# with the updater manifest and digest evidence attached. When the Apple
# credentials below exist, the installers are additionally Developer ID signed
# and notarized; without them the same pipeline publishes unsigned installers
# whose release notes carry the Gatekeeper instructions. The minisign updater
# signature is independent of Apple and applies in both shapes.
#
# Secrets the signing layer reads (repository settings):
#   APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD / APPLE_SIGNING_IDENTITY
#   APPLE_API_ISSUER / APPLE_API_KEY / APPLE_API_KEY_CONTENT
#   TAURI_SIGNING_PRIVATE_KEY / TAURI_SIGNING_PRIVATE_KEY_PASSWORD (optional)
# A manual run may pass sign=false to exercise the pipeline unsigned; unsigned
# dispatch artifacts stay workflow artifacts and are never published.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      sign:
        description: 'Sign and notarize the installers'
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  SIGN: ${{ github.event.inputs.sign || 'true' }}

jobs:
  build-installer:
    name: build-${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: aarch64
            runner: macos-15
            target: aarch64-apple-darwin
          - name: x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    outputs:
      signed: ${{ steps.signing.outputs.signed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Enable exact package-manager version
        run: corepack enable
      - name: Set up exact packaged Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: apps/desktop/.node-version
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Install the macOS Rust target
        run: rustup target add ${{ matrix.target }}
      # Signing is a layer the pipeline adds when the Apple credentials exist:
      # an owner without a Developer account still gets a working, updateable
      # installer, and adding the secrets later upgrades the same workflow in
      # place. What never degrades silently is a release that was asked to sign.
      # The credentials are forwarded through $GITHUB_ENV only when present: an
      # empty APPLE_SIGNING_IDENTITY still counts as "set" for codesign.
      - name: Resolve the signing mode
        id: signing
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_API_KEY_CONTENT" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi
          if [ "$SIGN" = "true" ] && [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::Publishing requires the TAURI_SIGNING_PRIVATE_KEY secret. See docs/release-runbook.zh-CN.md."
            exit 1
          fi
          if [ "${{ github.event_name == 'workflow_dispatch' && github.event.inputs.sign || 'false' }}" = "true" ] && [ -z "$APPLE_CERTIFICATE" ]; then
            echo "::error::A signed dispatch requires the Apple signing secrets. See docs/release-runbook.zh-CN.md."
            exit 1
          fi
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            printf '%s\n' "$TAURI_SIGNING_PRIVATE_KEY" > "$RUNNER_TEMP/floway-updater.key"
            echo "TAURI_SIGNING_PRIVATE_KEY_PATH=$RUNNER_TEMP/floway-updater.key" >> "$GITHUB_ENV"
            if [ -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ]; then
              echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" >> "$GITHUB_ENV"
            fi
          fi
          if [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_API_KEY_CONTENT" ]; then
            printf '%s' "$APPLE_API_KEY_CONTENT" > "$RUNNER_TEMP/AuthKey.p8"
            {
              echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY"
              echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
              echo "APPLE_API_KEY=$APPLE_API_KEY"
              echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8"
            } >> "$GITHUB_ENV"
          fi
      - name: Import the Developer ID certificate
        if: steps.signing.outputs.signed == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          certificate_path="$RUNNER_TEMP/floway-developer-id.p12"
          keychain_path="$RUNNER_TEMP/floway-signing.keychain-db"
          echo -n "$APPLE_CERTIFICATE" | base64 --decode --output "$certificate_path"
          security create-keychain -p "" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "" "$keychain_path"
          security import "$certificate_path" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple: -k "" "$keychain_path"
          security list-keychain -d user -s "$keychain_path"
      - name: Build the web dashboard
        run: pnpm run build:web
      # Signing credentials arrive through $GITHUB_ENV from the signing-mode
      # step, so this build sees them only when they actually exist.
      - name: Build the installer (signed and notarized when credentials exist)
        run: pnpm --filter @floway-dev/desktop exec tauri build --target ${{ matrix.target }}
      - name: Gate the release on the packaged verification
        run: pnpm --filter @floway-dev/desktop run test:packaged:macos -- --target=${{ matrix.target }} --profile=release --launch=yes
      - name: Upload the architecture artifacts
        uses: actions/upload-artifact@v4
        with:
          name: floway-macos-${{ matrix.name }}
          path: |
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: error

  publish:
    name: publish
    needs: [build-installer]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Enable exact package-manager version
        run: corepack enable
      - name: Set up exact packaged Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: apps/desktop/.node-version
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Collect the architecture artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: floway-macos-*
          path: release-artifacts
          merge-multiple: true
      - name: Assemble the updater manifest and digest evidence
        env:
          TAG: ${{ github.ref_name }}
        run: pnpm --filter @floway-dev/desktop run release:manifest -- --version="${TAG#v}" --tag="$TAG" --repo=${{ github.repository }} --dir=release-artifacts
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          {
            echo "Floway $TAG"
            echo
            echo "- Source commit: ${{ github.sha }}"
            if [ -z "$APPLE_CERTIFICATE" ] || [ -z "$APPLE_API_KEY_CONTENT" ]; then
              echo
              echo '> [!IMPORTANT]'
              echo '> This build is not Developer ID signed or notarized. To install: open the DMG, drag Floway to Applications, then right-click the app and choose Open — or run `xattr -dr com.apple.quarantine /Applications/Floway.app` once. Updates remain integrity-protected by the built-in updater signature.'
              echo '>'
              echo '> 本安装包未经 Developer ID 签名与公证。安装方式：打开 DMG 并将 Floway 拖入“应用程序”，然后右键点 App 选“打开”——或执行一次 `xattr -dr com.apple.quarantine /Applications/Floway.app`。内置更新签名不受影响。'
            fi
            echo
            echo '```'
            cat release-artifacts/sha256sums.txt
            echo '```'
          } > release-notes.md
          gh release create "$TAG" \
            --title "Floway $TAG" \
            --notes-file release-notes.md \
            release-artifacts/*.dmg \
            release-artifacts/*.app.tar.gz \
            release-artifacts/*.app.tar.gz.sig \
            release-artifacts/floway-update.json \
            release-artifacts/sha256sums.txt
