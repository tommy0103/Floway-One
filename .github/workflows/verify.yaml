name: Verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Only the tip of a branch needs verifying; agents push feature branches in
# quick succession.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        check:
          - name: lint
            run: pnpm run lint
          - name: typecheck
            run: pnpm run typecheck
          - name: test
            run: pnpm run test
          - name: installers
            run: pnpm run test:installers
          - name: generated-assets
            run: pnpm run check:generated-assets
          - name: agents-md
            run: pnpm run check:agents-md
          - name: verify-parity
            run: pnpm run check:verify-parity
          # `build.yaml` builds the SPA image, but only on `main` and on a
          # schedule. Building here is what puts the bundler and the build
          # output assertions in front of a pull request; `apps/web`'s own
          # `build` chains `check:build-output` so that no build path — this
          # one, the image, a deploy — can emit a bundle nobody asserted
          # against.
          - name: build
            run: pnpm run build:web && pnpm run test:packaged-node
    name: ${{ matrix.check.name }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Enable Corepack
        run: corepack enable
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      # `apps/web/.react-router/types` is generated and gitignored, yet it sits
      # in the web tsconfig's `include`, and the workspace lint config is
      # type-aware. Locally the types exist as a side effect of `dev` or
      # `build`; a fresh checkout has to generate them or every route module
      # fails to resolve `./+types/...`.
      - name: Generate route types
        run: pnpm run typegen
      - name: ${{ matrix.check.name }}
        run: ${{ matrix.check.run }}

  desktop:
    name: desktop-${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Enable exact package-manager version
        run: corepack enable
      - name: Set up exact packaged Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: apps/desktop/.node-version
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Install both macOS Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Build, install, launch, and inspect the desktop application
        run: pnpm run test:desktop

  packaged-node-windows:
    name: packaged-node-windows
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Enable Corepack
        run: corepack enable
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build and test packaged Node runtime
        run: pnpm run build:web && pnpm run test:packaged-node

  packaged-node-linux-secret-service:
    name: packaged-node-linux-secret-service
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Enable Corepack
        run: corepack enable
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Install Secret Service
        run: sudo apt-get update && sudo apt-get install --yes gnome-keyring
      - name: Build and test packaged Node runtime with Secret Service
        run: pnpm run build:web && pnpm run test:packaged-node
        env:
          FLOWAY_REQUIRE_CREDENTIAL_STORE: '1'
          FLOWAY_START_TEST_SECRET_SERVICE: '1'

  packaged-node-macos:
    name: packaged-node-macos
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Enable Corepack
        run: corepack enable
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build and test packaged Node runtime
        run: pnpm run build:web && pnpm run test:packaged-node
