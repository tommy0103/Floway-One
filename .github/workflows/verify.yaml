name: Verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Only the tip of a branch needs verifying; agents push feature branches in
# quick succession.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        check:
          - name: lint
            run: pnpm run lint
          - name: typecheck
            run: pnpm run typecheck
          - name: test
            run: pnpm run test
          - name: installers
            run: pnpm run test:installers
          - name: generated-assets
            run: pnpm run check:generated-assets
          - name: agents-md
            run: pnpm run check:agents-md
          - name: verify-parity
            run: pnpm run check:verify-parity
          # `build.yaml` builds the SPA image, but only on `main` and on a
          # schedule. Building here is what puts the bundler and the build
          # output assertions in front of a pull request; `apps/web`'s own
          # `build` chains `check:build-output` so that no build path — this
          # one, the image, a deploy — can emit a bundle nobody asserted
          # against.
          - name: build
            run: pnpm run build:web && pnpm run test:packaged-node
    name: ${{ matrix.check.name }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Enable Corepack
        run: corepack enable
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      # `apps/web/.react-router/types` is generated and gitignored, yet it sits
      # in the web tsconfig's `include`, and the workspace lint config is
      # type-aware. Locally the types exist as a side effect of `dev` or
      # `build`; a fresh checkout has to generate them or every route module
      # fails to resolve `./+types/...`.
      - name: Generate route types
        run: pnpm run typegen
      - name: ${{ matrix.check.name }}
        run: ${{ matrix.check.run }}

  desktop:
    name: desktop-${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    env:
      # Keep clean bundle verification while reusing compiler results outside
      # the target directory removed by test:desktop.
      # https://github.com/mozilla/sccache/blob/v0.18.0/docs/Local.md
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      SCCACHE_CACHE_SIZE: '2G'
      SCCACHE_DIRECT: 'false'
      RUSTC_WRAPPER: sccache
      # Rust incremental compilation is incompatible with compiler caching.
      # https://github.com/mozilla/sccache/blob/v0.18.0/docs/Rust.md
      CARGO_INCREMENTAL: '0'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Enable exact package-manager version
        run: corepack enable
      - name: Set up exact packaged Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: apps/desktop/.node-version
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Restore Rust compiler cache
        id: compiler-cache
        # https://github.com/actions/cache/releases/tag/v6.1.0
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: desktop-sccache-v18-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: desktop-sccache-v18-${{ runner.os }}-${{ runner.arch }}-
      - name: Set up Rust compiler cache
        # https://github.com/mozilla-actions/sccache-action/releases/tag/v0.0.11
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.18.0
      - name: Install both macOS Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Build, install, launch, and inspect the desktop application
        run: pnpm run test:desktop
      - name: Save Rust compiler cache
        if: ${{ always() && !cancelled() && steps.compiler-cache.outputs.cache-hit != 'true' }}
        # https://github.com/actions/cache/releases/tag/v6.1.0
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}

  packaged-node-windows:
    name: packaged-node-windows
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Enable Corepack
        run: corepack enable
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build and test packaged Node runtime
        run: pnpm run build:web && pnpm run test:packaged-node

  packaged-node-linux-secret-service:
    name: packaged-node-linux-secret-service
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Enable Corepack
        run: corepack enable
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Install Secret Service
        run: sudo apt-get update && sudo apt-get install --yes gnome-keyring
      - name: Build and test packaged Node runtime with Secret Service
        run: pnpm run build:web && pnpm run test:packaged-node
        env:
          FLOWAY_REQUIRE_CREDENTIAL_STORE: '1'
          FLOWAY_START_TEST_SECRET_SERVICE: '1'

  packaged-node-macos:
    name: packaged-node-macos
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Enable Corepack
        run: corepack enable
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build and test packaged Node runtime
        run: pnpm run build:web && pnpm run test:packaged-node
